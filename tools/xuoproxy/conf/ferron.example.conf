// ============================================================================
// Ferron config for play.example.com, fronting xuoproxy on 127.0.0.1:8777.
// Merge into your existing config:
// keep the shared `* { tls ... }` block if you already have one.
//
// Notes
// - X-Forwarded-For is REPLACED with the real client IP (proxy_request_header_
//   replace), so a client cannot spoof its way past xuoproxy's rate limiter /
//   ban list. xuoproxy must run with --trust-proxy (run-prod.sh does).
// - WebSocket upgrades (/ws/<host>/<port> shard bridge) are proxied
//   transparently; no extra directive needed. The bridge allowlist is
//   auto-derived by xuoproxy from shards.cfg LoginServer= lines.
// - The outer `limit` is a coarse shield in front of xuoproxy's own
//   per-IP token bucket. Keep the burst generous: one cold client boot
//   fires ~1700 blob window GETs.
// - /stats and /admin/* are token-gated by xuoproxy itself; the location
//   blocks below add an OPTIONAL IP allowlist in front of them - fill in
//   your office/VPN IPs or delete the blocks.
// ============================================================================

play.example.com {
    // Automatic TLS (Let's Encrypt); or use: tls "/etc/ssl/...crt" "/etc/ssl/...key"
    auto_tls_contact "admin@example.com"

    // ---- hard limits at the edge ------------------------------------------
    limit rate=200 burst=400
    // never let a request body in: this service is read-only for clients
    limit_content_length 1048576

    // ---- optional: lock the ops API to your IPs ---------------------------
    location "/stats" {
        // allow "203.0.113.7"    // allowlist
        // allow "198.51.100.0/24"
        deny all
        proxy "http://127.0.0.1:8777"
    }
    location "/admin" {
        deny all
        proxy "http://127.0.0.1:8777"
    }

    // ---- everything else -> xuoproxy --------------------------------------
    location "/" {
        proxy "http://127.0.0.1:8777"
        proxy_request_header_replace "X-Forwarded-For" "{client_ip}"
        proxy_request_header "X-Forwarded-Proto" "{scheme}"
        proxy_request_header "X-Real-IP" "{client_ip}"
    }

    // basic hardening headers on top of xuoproxy's COOP/COEP
    header "Strict-Transport-Security" "max-age=31536000; includeSubDomains"
    header "X-Content-Type-Options" "nosniff"
    header "Referrer-Policy" "no-referrer"

    // health check against the proxy's own /healthz
    status 200 url="/healthz" body="ok"
}
