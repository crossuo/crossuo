<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <!-- pinch zoom is the mobile game zoom: the browser scales the page
         (canvas included). No maximum-scale/user-scalable - they would block
         it. Single-finger gestures stay blocked (see touch handlers below) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CrossUO (web)</title>
    <style>
      html, body { margin: 0; padding: 0; background: black; color: #cfd2dc;
                   font-family: system-ui, sans-serif; height: 100%;
                   /* touch devices: never let the browser own the page
                      gestures (pull-to-refresh, pinch zoom, scroll bounce) */
                   overscroll-behavior: none; }
      #wrap { display: flex; flex-direction: column; align-items: center;
              justify-content: center;
              /* safe center: keep the loading layout centered while it fits,
                 but never center an OVERFLOWING stack - centering overflows
                 both edges and a page cannot scroll to negative y, so the
                 maximized (viewport-sized) canvas ended up with its top
                 rows unreachable (measured: rect.top = -24 => the top of the
                 game render cut off). Overflow must fall back to start */
              justify-content: safe center;
              height: 100%; }
      /* once the game maximizes, the canvas alone IS the page: the status/log
         rows must leave the flow, otherwise they extend the document below
         the viewport and the resulting scrollbars shrink the client area
         (vertical scrollbar re-centered the canvas into a 7px horizontal
         cut and a 15px-shorter wrap re-introduced a vertical offset) */
      #wrap.maximized #status, #wrap.maximized #log { display: none; }
      /* no fixed size: SDL/emscripten controls the canvas dimensions
         (SDL_SetWindowSize updates the canvas element size). SDL probes
         the css box with a 1x1 canvas to detect external css sizing and
         adopts whatever it reads when SDL_WINDOW_RESIZABLE - so the css
         box must match the intrinsic size: use an outline (no layout
         impact), never a border (1px border would turn the 1x1 probe
         into a 3x3 bounding box and shrink the window to it) */
      canvas.crossuo { image-rendering: pixelated; background: #000;
                       outline: 0px solid black; outline-offset: -1px;
                       /* all canvas touches belong to the game (the client
                          gesture layer takes it from here) */
                       touch-action: none;
                       user-select: none; -webkit-user-select: none;
                       -webkit-touch-callout: none; }
      /* touch devices: the canvas IS the screen - no frame, no page chrome,
         fill the visual viewport edge to edge.
         Chrome tablets: the 100%-height chain + flex 'safe center' resolve
         against the LARGER layout viewport (dynamic URL bar), while the
         canvas is sized to innerHeight - centering shows page background
         around the canvas like a border. Anchor to the top edge instead:
         innerHeight always matches the TOP of the visual viewport; dvh
         tracks the dynamic viewport so the wrap never exceeds it. Horizontal
         centering is kept (width mismatch is rare). */
      html.web-touch { overflow: hidden; }
      html.web-touch body { overflow: hidden; }
      html.web-touch #wrap { height: 100dvh;
                             justify-content: flex-start; }
      /* the browser owns two-finger pinch (page zoom = the game zoom);
         everything else stays blocked. pinch-zoom forbids pan/double-tap
         zoom, and the JS handlers below only consume single-finger events */
      html.web-touch canvas.crossuo { outline: none;
                                      touch-action: pinch-zoom; }
      #status { margin-top: 8px; font-size: 13px; opacity: .8; }
      #log { margin-top: 8px; font-size: 11px; opacity: .6; white-space: pre;
             height: 4em; overflow: hidden; }
      /* pre-boot shard picker: dependency-free overlay, shown only before
         crossuo.js loads (bootClient removes it); monospace panel matching
         the page's dark scheme */
      #shardPicker { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                     background: rgba(8, 8, 12, .88); z-index: 1000;
                     display: flex; align-items: center; justify-content: center;
                     font-family: ui-monospace, Menlo, Consolas, monospace; }
      #shardPicker .panel { background: #16171d; border: 1px solid #2a2c36;
                            border-radius: 6px; width: 440px; max-width: 92vw;
                            box-sizing: border-box; padding: 14px;
                            display: flex; flex-direction: column; }
      #shardPicker .title { font-size: 14px; color: #e8eaf2; margin-bottom: 10px; }
      /* the list never exceeds ~80% of the viewport; overflow scrolls (a
         long list scrolls inside .list, the panel stays compact) */
      #shardPicker .list { flex: 1; min-height: 0; max-height: 80vh;
                           overflow-y: auto; border: 1px solid #2a2c36; }
      #shardPicker .row { padding: 7px 10px; cursor: pointer;
                          border-bottom: 1px solid #20222b;
                          display: flex; align-items: center; gap: 10px; }
      #shardPicker .row:last-child { border-bottom: none; }
      #shardPicker .row:hover { background: #1d1f27; }
      #shardPicker .row.sel,
      #shardPicker .row.sel:hover { background: #24304a; }
      /* highlighted entries are promoted to the top and marked with a
         subtle accent bar + star prefix (see the row builder) */
      #shardPicker .row.featured { border-left: 3px solid #4f7bd9; }
      /* the text column grows, the optional card action stays right and
         vertically centered (flex align-items on .row) */
      #shardPicker .rowmain { flex: 1; min-width: 0; }
      #shardPicker .name { font-size: 13px; color: #dfe3ee; }
      #shardPicker .sub { font-size: 11px; opacity: .65; margin-top: 2px; }
      /* the shard url in the sub line: a link, so it must not look like the
         row's selection text; underlined, brightened on hover */
      #shardPicker .sub a { color: inherit; text-decoration: underline;
                            text-decoration-style: dotted; }
      #shardPicker .sub a:hover { opacity: 1; color: #8fb0ff; }
      /* per-card action (Create account): a small, self-contained button on
         the right of the row; the row's own click must not fire when it is
         used, so its handler stops propagation */
      #shardPicker .card-action { flex: 0 0 auto; padding: 4px 10px;
                                  font-size: 11px; }
      #shardPicker .footer { margin-top: 12px; }
      #shardPicker .state { font-size: 11px; opacity: .7; min-height: 1em; }
      #shardPicker .buttons { margin-top: 10px; }
      #shardPicker button { background: #24304a; color: #dfe3ee;
                            border: 1px solid #3d5aa8; border-radius: 4px;
                            padding: 6px 14px; font: inherit; font-size: 12px;
                            cursor: pointer; }
      #shardPicker .buttons button { margin: 12px auto 0; display: block; }
      #shardPicker button:disabled { opacity: .4; cursor: default; }
      #shardPicker button:not(:disabled):hover { background: #2c3b5c; }
      /* graphical streaming progress bar: lives OUTSIDE the flow entirely.
         #wrap is a flex column and any in-flow row below the canvas extends
         the document past the viewport once maximized (scrollbars re-center
         and clip the canvas - the measured bugs documented above), so the bar
         is position:fixed and re-anchored to the canvas rect every poll:
         visually just below the canvas, never in flow. DOM placement is
         cosmetic. z-index 900 keeps it below #shardPicker (1000). */
      #streamBar { position: fixed; display: none; height: 16px;
                   background: #16171d; border: 1px solid #2a2c36;
                   border-radius: 4px; overflow: hidden; z-index: 900;
                   box-sizing: border-box; }
      #streamBarFill { height: 100%; width: 0%; background: #4f7bd9; }
      #streamBarText { position: absolute; left: 0; right: 0; top: 0;
                       text-align: center; font: 11px ui-monospace, Menlo,
                       Consolas, monospace; color: #dfe3ee; line-height: 14px;
                       white-space: nowrap; overflow: hidden; }
      /* throughput mode (open-ended sweep, no percent): full-width bar with a
         subtle opacity pulse instead of a growing fill */
      #streamBar.indet #streamBarFill { width: 100%; }
      #streamBar.indet #streamBarFill { animation: streamPulse 1.2s infinite; }
      @keyframes streamPulse { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <!-- the emscripten runtime binds to Module.canvas -->
      <canvas class="crossuo" id="canvas" width="640" height="480" tabindex="-1"
              oncontextmenu="event.preventDefault()"></canvas>
      <div id="status">loading&#8230;</div>
      <div id="log"></div>
    </div>
    <script>
      // pthread builds run the runtime before the glue reads this object, so
      // create it up front and attach every handler to the same instance
      var Module = window.Module || {};
      // client-side diagnostics channel: the wasm client posts one-line
      // events (touch gestures, size changes) through here; they land in the
      // serving proxy's log (/client-log)
      Module.clientLog = function (line) {
        try { fetch('client-log', { method: 'POST', body: String(line).slice(0, 500) }); }
        catch (e) { /* diagnostics must never break the page */ }
      };
      // phone keyboard bridge: mobile browsers only open the virtual
      // keyboard for a focused editable element, so the CANVAS itself is
      // made editable (contenteditable) while a text entry has focus. Its
      // keys then land inside SDL's own input path and the client handles
      // them like any desktop keyboard; the queue below carries only what
      // SDL cannot see: enter, and the on-screen erase key (Android fires
      // no key event for it - the edit it makes to the canvas is its only
      // trace). Numbers only: -1 backspace, -2 enter, else UTF-16 units.
      Module.kbdQueue = [];
      Module.kbdTake = function () {
        return Module.kbdQueue.length ? Module.kbdQueue.shift() : null;
      };
      Module.kbdEvents = {
        push: function (ev) {
          if (ev.t === 'B') {
            Module.kbdQueue.push(-1);
          } else if (ev.t === 'R') {
            Module.kbdQueue.push(-2);
          } else if (ev.t === 'T') {
            var s = ev.s || '';
            for (var i = 0; i < s.length; i++) {
              Module.kbdQueue.push(s.charCodeAt(i));
            }
          }
          if (Module.kbdQueue.length > 128) {
            Module.kbdQueue.splice(0, Module.kbdQueue.length - 128);
          }
        }
      };
      var kbdCanvas = document.getElementById('canvas');
      var kbdWanted = false;
      // a printable keydown means the character reaches the game through
      // SDL's keypress: the copy the browser inserts into the canvas must
      // then be dropped, not queued (or every letter would arrive twice)
      var kbdTyped = false;
      var kbdClear = function () {
        if (kbdCanvas) {
          kbdCanvas.textContent = '';
        }
      };
      Module.kbdClear = kbdClear;
      var kbdOpen = function () {
        if (!kbdCanvas) {
          return;
        }
        // editable = focusable: without this the focus() call is a no-op
        // and the virtual keyboard never opens
        kbdCanvas.contentEditable = 'true';
        // iOS refuses to edit a user-select:none element; the shell's
        // touch-blocker keeps the gestures working, only selection is freed
        kbdCanvas.style.userSelect = 'text';
        kbdCanvas.style.webkitUserSelect = 'text';
        kbdCanvas.style.outline = 'none';
        kbdCanvas.style.caretColor = 'transparent';
        try {
          kbdCanvas.focus({ preventScroll: true });
        } catch (e) {
          try { kbdCanvas.focus(); } catch (e2) { /* retried per gesture */ }
        }
      };
      var kbdCancel = function () {
        kbdWanted = false;
        if (kbdCanvas) {
          kbdCanvas.contentEditable = 'false';
          kbdCanvas.style.userSelect = '';
          kbdCanvas.style.webkitUserSelect = '';
          kbdCanvas.style.caretColor = '';
          kbdClear();
          if (document.activeElement === kbdCanvas) {
            kbdCanvas.blur();
          }
        }
      };
      Module.phoneKeyboard = function (show) {
        kbdWanted = !!show;
        kbdClear();
        if (kbdWanted) {
          kbdOpen();
        } else {
          kbdCancel();
        }
      };
      // per frame: some browsers drop the editable focus on a layout change
      // or scroll without any event - take the editability back so the next
      // gesture reopens the keyboard
      Module.kbdSync = function () {
        if (!kbdWanted) {
          return;
        }
        if (kbdCanvas && document.activeElement !== kbdCanvas) {
          kbdCanvas.contentEditable = 'false';
        }
      };
      // browsers honor focus() only inside a user gesture, and the client
      // raises the keyboard from a frame callback: every interaction retries
      // until the canvas actually takes the focus
      ['mousedown', 'touchstart', 'click'].forEach(function (evName) {
        document.addEventListener(evName, function () {
          if (kbdWanted && kbdCanvas && document.activeElement !== kbdCanvas) {
            kbdOpen();
          }
        });
      });
      if (kbdCanvas) {
        // deletions: the erase key of an on-screen keyboard fires no key
        // event everywhere (Android never does), but the edit it makes to
        // the canvas always fires this. Enter never reaches SDL either (it
        // would be seen twice - the queue is its single path)
        kbdCanvas.addEventListener('input', function (e) {
          if (!kbdWanted) {
            kbdClear();
            return;
          }
          var type = (e && e.inputType) || '';
          if (type.indexOf('delete') === 0) {
            Module.kbdEvents.push({ t: 'B' });
            kbdClear();
            return;
          }
          // text that never went through a key (composition, autocorrect,
          // a swipe keyboard): relay it like typed text
          var text = kbdCanvas.textContent || '';
          if (text && !kbdTyped) {
            Module.kbdEvents.push({ t: 'T', s: text });
          }
          kbdTyped = false;
          kbdClear();
        });
        kbdCanvas.addEventListener('keydown', function (e) {
          if (!kbdWanted) {
            return;
          }
          var k = e.key;
          if (k === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
            kbdClear();
            Module.kbdEvents.push({ t: 'R' });
          } else if (k === 'Backspace') {
            // SDL must not delete on its own (the input event of the edit
            // queues the deletion once); an EMPTY canvas fires no input
            // event, so that case is the key's alone
            e.stopPropagation();
            if (!(kbdCanvas.textContent || '').length) {
              e.preventDefault();
              Module.kbdEvents.push({ t: 'B' });
            }
          } else if (k && k.length === 1) {
            // printable: SDL gets it through keypress (stopping the
            // keydown here also keeps the game's macro keys quiet while
            // typing); the canvas copy is dropped on the input event
            e.stopPropagation();
            kbdTyped = true;
          }
        });
      }
      // ?log=1 gate - page-global: the audio and idbfs blocks below live
      // outside the boot IIFE and share it
      var WEBLOG = new URLSearchParams(window.location.search).get('log') === '1';
      // touch capable device? detected once here (page side), used to block
      // browser gesture takeover and mirrored on the documentElement so the
      // client could query it; the client re-derives the same flag itself
      var WEB_TOUCH_DEVICE = (navigator.maxTouchPoints > 0) || ('ontouchstart' in window);
      if (WEB_TOUCH_DEVICE) {
        document.documentElement.classList.add('web-touch');
        // Block ALL browser touch gestures page-wide, not just on the canvas:
        // the SDL emscripten backend only preventDefaults some touch events,
        // and a swipe starting on any page pixel must never reach the browser
        // (pull-to-refresh on a downward swipe kills the game). Only the
        // pre-boot shard picker keeps native touch behavior (scrolling).
        // preventDefault on touchstart stops scroll/pinch/pull-to-refresh
        // before they are claimable; the client still sees its own
        // emscripten-registered handlers run (listener order is independent).
        var webTouchBlock = function (e) {
          if (e.target && e.target.closest && e.target.closest('#shardPicker')) {
            return;
          }
          // multi-finger sequences go to the browser (pinch zoom); only
          // single-finger touches are consumed (pull-to-refresh, scroll)
          if (e.touches && e.touches.length !== 1) {
            return;
          }
          e.preventDefault();
        };
        ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (evName) {
          document.addEventListener(evName, webTouchBlock, { passive: false });
        });
      }
      // device diagnostics: ?debug=1 POSTs one-line layout snapshots to the
      // snapshots to the serving proxy (xuoproxy /client-log) so a broken
      // mobile layout (tiny/mis-sized canvas, viewport quirks) can be
      // diagnosed from the SERVER log without any access to the device
      var WEB_DEBUG = new URLSearchParams(window.location.search).get('debug') === '1';
      if (WEB_DEBUG) {
        var diagT0 = Date.now();
        var diagSeq = 0;
        var diagLast = 0;
        var diagSend = function (why) {
          try {
            var c = document.getElementById('canvas');
            var r = c.getBoundingClientRect();
            var w = document.getElementById('wrap');
            var vv = window.visualViewport;
            var line = [
              'v=1', 'n=' + (diagSeq++), 'why=' + why,
              't=' + Math.floor((Date.now() - diagT0) / 1000) + 's',
              'inner=' + window.innerWidth + 'x' + window.innerHeight,
              'dpr=' + window.devicePixelRatio,
              vv ? ('vv=' + Math.round(vv.width) + 'x' + Math.round(vv.height) +
                    '@' + Math.round(vv.offsetTop)) : '',
              'buf=' + c.width + 'x' + c.height,
              'css=' + Math.round(r.width) + 'x' + Math.round(r.height) +
                    '+' + Math.round(r.x) + '+' + Math.round(r.y),
              'wrap=' + (w ? w.clientWidth + 'x' + w.clientHeight : '?'),
              'style=' + (c.getAttribute('style') || '-')
            ].join(' ');
            fetch('client-log', { method: 'POST', body: line });
          } catch (e) { /* never break the page over diagnostics */ }
        };
        diagSend('load');
        window.addEventListener('resize', function () {
          var now = Date.now();
          if (now - diagLast > 500) { diagLast = now; diagSend('resize'); }
        });
        window.addEventListener('orientationchange', function () { diagSend('orientation'); });
        var diagTicks = 0;
        var diagTimer = setInterval(function () {
          diagSend('poll');
          if (++diagTicks >= 30) clearInterval(diagTimer);
        }, 2000);
      }
      // NOTE: Module.preRun does NOT run on the page in PROXY_TO_PTHREAD
      // builds (the boot sequence that consumes it executes on the pthread
      // worker) - everything that must happen on the page lives in the
      // when-ready block below.
      (function () {
        // ?log=1: keep the page furniture (status line + log pane) and mirror
        // every client line to the console. Without it the page ships ONLY
        // the canvas: console.log is a per-line serialization cost and the
        // log pane's textContent += re-copies the whole pane per line, which
        // is measurable at INFO flood rates
        var statusEl = document.getElementById('status');
        var logEl = document.getElementById('log');
        if (!WEBLOG)
        {
          if (statusEl && statusEl.parentNode) statusEl.parentNode.removeChild(statusEl);
          if (logEl && logEl.parentNode) logEl.parentNode.removeChild(logEl);
        }
        function setStatus(text) {
          if (!WEBLOG) return;
          statusEl.textContent = text;
        }
        // pass URL query parameters to the client as command line arguments:
        //   index.html?streaming-product=http://host/patch&streaming-workers=4
        // NOTE: Module.arguments is NOT assembled here anymore - the runtime
        // consumes it once at init and the pre-boot shard picker below must
        // merge the chosen shard's flags in first, so the final assembly
        // moved into buildClientArgs()/bootClient() at the bottom of the page
        Module.canvas = (function () {
          var c = document.getElementById('canvas');
          var scaleMode = new URLSearchParams(window.location.search).get('scale');
          if (scaleMode === 'fixed') {
            c.classList.add('fixed');
          } else {
            c.classList.add('page');
          }
          c.addEventListener('webglcontextlost', function (e) {
            e.preventDefault();
            setStatus('context lost, reloading');
            setTimeout(function () { location.reload(); }, 1000);
          });
          // the maximize (CGameScreen::Init -> MaximizeWindow) sizes the
          // canvas to the viewport; from then on the canvas box alone must
          // own the layout - the loading rows below it would otherwise
          // overflow the flex column (see the .maximized rule above and the
          // safe-center comment). The observer only fires on real box
          // changes, so this is O(1) per canvas resize
          if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(function (entries) {
              var r = entries[entries.length - 1].contentRect;
              var full = r.height >= window.innerHeight &&
                         r.width >= window.innerWidth;
              document.getElementById('wrap').classList.toggle('maximized', full);
            }).observe(c);
          }
          return c;
        })();
        Module.setStatus = function (text) {
          if (text && WEBLOG) statusEl.textContent = text;
        };
        Module.print = function (text) {
          if (!WEBLOG) return;
          console.log(text);
          logEl.textContent += text + '\n';
          logEl.scrollTop = logEl.scrollHeight;
        };
        Module.printErr = function (text) {
          if (!WEBLOG) return;
          console.error(text);
          logEl.textContent += text + '\n';
          logEl.scrollTop = logEl.scrollHeight;
        };
        Module.onRuntimeInitialized = function () {
          setStatus('running');
          Module.print('ARGS: ' + JSON.stringify(Module.arguments));
        };
        window.addEventListener('error', function (e) {
          if (!WEBLOG) return;
          var t = (e.error && e.error.stack) ? e.error.stack : e.message;
          logEl.textContent += 'EXCEPTION: ' + t + '\n';
        });
      })();
      // Web Audio output. The AudioContext MUST live on this (DOM) thread:
      // (a) autoplay policies require a user gesture and the gesture happens
      // here, (b) the pthread worker has no audio device (the earlier attempt
      // to let SDL2 create the context inside the worker crashed on
      // Module.SDL2.audioContext). The context is created suspended at page
      // load (the hardware sample rate is readable right away - the sound
      // system inits SoLoud to it before any gesture) and the first
      // pointerdown/keydown resumes it; CDP-dispatched input counts as a
      // gesture. PCM travels through a SharedArrayBuffer ring the pthread
      // worker fills from SoLoud's manual mixer (SoundManager web backend):
      //
      //   [0] writeIdx (frames, worker)   [1] readIdx (frames, here)
      //   [2] capacity (frames)           [3] context sampleRate (here)
      //   [4] unlocked (here)             [5] context running (here)
      //   [6] underrun callbacks (here)   [7] magic 'XUA1'
      //   float32 area @ byte 32: capacity * 2 interleaved stereo samples
      //
      // A ScriptProcessorNode pulls the ring (deprecated but universal and
      // needs no extra module file in dist; an AudioWorklet would read the
      // same ring - swap it in later without touching the worker side).
      (function () {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || !window.SharedArrayBuffer) {
          console.warn('[audio] WebAudio/SAB unavailable, web sound disabled');
          return;
        }
        var ctx = new AC();
        var node = ctx.createScriptProcessor(4096, 2, 2);
        var analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        node.connect(analyser);
        analyser.connect(ctx.destination);
        var td = new Float32Array(analyser.fftSize);
        var audio = (window.__xuoAudio = {
          ctx: ctx,
          unlocked: false,
          ring: null,
          words: null,
          samples: null,
          cap: 0,
          read: 0,
          callbacks: 0,
          underruns: 0,
          // rolling RMS of what this node actually output (diag beat reads
          // and resets these)
          rmsSum: 0,
          rmsCount: 0,
          rmsPeak: 0,
          fill: -1
        });
        node.onaudioprocess = function (e) {
          audio.callbacks++;
          var out = e.outputBuffer;
          var L = out.getChannelData(0);
          var R = out.getChannelData(1);
          var w = audio.words;
          if (!w || !audio.unlocked) {
            L.fill(0);
            R.fill(0);
            return;
          }
          var n = L.length;
          // wrap-safe (both counters are Int32 and advance together)
          var avail = (Atomics.load(w, 0) - Atomics.load(w, 1)) | 0;
          var got = avail < n ? avail : n;
          if (got > 0) {
            var s = audio.samples;
            var cap = audio.cap;
            var r = audio.read % cap;
            for (var i = 0; i < got; i++) {
              var o = ((r + i) % cap) * 2;
              L[i] = s[o];
              R[i] = s[o + 1];
            }
            audio.read = (audio.read + got) | 0;
            Atomics.store(w, 1, audio.read);
          }
          if (got < n) {
            // underrun: render silence for the remainder (a worker stall or
            // a hidden tab - rAF stops, the pump stops, the ring drains)
            L.fill(0, got);
            R.fill(0, got);
            Atomics.add(w, 6, 1);
            audio.underruns++;
          }
          audio.fill = avail;
          // meters: RMS of the actual output (non-zero => audible signal)
          try {
            analyser.getFloatTimeDomainData(td);
            var sq = 0;
            for (var j = 0; j < td.length; j++) sq += td[j] * td[j];
            var rms = Math.sqrt(sq / td.length);
            audio.rmsSum += rms;
            audio.rmsCount++;
            if (rms > audio.rmsPeak) audio.rmsPeak = rms;

        // ---- pure helpers (extracted verbatim for the node test harness) ----

        // tolerant ini parser for the aggregated shards.cfg ([Shard]
        // sections): handles CRLF/CR/LF, line-leading ';'/'#' comments and
        // blank lines; keys are lower-cased; '[Shard]' sections without a
        // usable name= are skipped (warned)
        function parseShardsIni(text, warn) {
          function flush() {
            if (!cur) return;
            if (cur.shardname) out.push(cur);
            else if (warn) warn('[shards] section without name, skipped');
            cur = null;
          }
          var out = [];
          var cur = null;
          var lines = String(text).replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].replace(/^[ \t]+/, '').replace(/[ \t]+$/, '');
            if (!line || line.charAt(0) === ';' || line.charAt(0) === '#') continue;
            if (line.charAt(0) === '[') {
              flush();
              cur = /^\[\s*shard\s*\]$/i.test(line) ? {} : null;
              continue;
            }
            var eq = line.indexOf('=');
            if (!cur || eq < 1) continue; // stray line or empty key
            cur[line.substring(0, eq).replace(/[ \t]+$/, '').toLowerCase()] =
              line.substring(eq + 1).replace(/^[ \t]+/, '');
          }
          flush();
          return out;
        }

        // chosen shard -> client args. ONLY existing flags (src/Main.cpp
        // InitCli): --shard carries the raw name - the client sanitizes it
        // itself when deriving the per-shard streaming install dir
        // (SanitizeShardName, src/Misc.cpp), keeping it verbatim for the
        // window/page title; loginserver "host,port" maps to --host/--port
        // (port only when numeric - the flag is u32); producturl is a plain
        // data product url
        // passed via --streaming-product (the client deduces the product
        // style from the content, vfs_aops_product_url) - an http(s) url
        // routes through the /stream relay, "local:<name>"/bare-relative
        // values map to the deployment's same-origin /data/<name>/ mounts,
        // empty = manual install and maps to nothing (v1: clientversion and
        // the links stay unparsed - see the block comment above)
        function shardToArgs(shard) {
          var args = [];
          if (!shard || !shard.shardname) return args;
          args.push('--shard=' + String(shard.shardname));
          // NOTE: the raw name is passed on purpose: the client derives the
          // per-shard install dir via SanitizeShardName() (src/Misc.cpp), but
          // the window/page title must show the name as the shard spells it
          // ("UO Realms: ..." etc), not the sanitized form
          var ls = String(shard.loginserver || '').split(',');
          var host = (ls[0] || '').trim();
          var port = (ls[1] || '').trim();
          if (host) args.push('--host=' + host);
          // 1-5 digits, 1-65535 only; out-of-range/non-numeric ports fall back
          // to the client default by omission of the --port flag
          if (/^\d{1,5}$/.test(port) && port > 0 && port <= 65535) args.push('--port=' + port);
          // version markers (there is no launcher on the web to write a
          // crossuo.cfg): clientversion drives cryptography, packet layout,
          // client type and verdata usage - a 1.25.x shard cannot boot with
          // the modern defaults
          var cv = String(shard.clientversion || '').trim();
          if (cv) args.push('--clientversion=' + cv);
          var pv = String(shard.protocolclientversion || '').trim();
          if (pv) args.push('--protocolversion=' + pv);
          var ct = String(shard.clienttype || '').trim();
          if (ct) args.push('--clienttype=' + ct);
          // the profile's Crypt option: without it the client pins the
          // encryption to NOCRYPT whatever the version - a shard asking for
          // the classic ciphers never connects
          var crypt = String(shard.crypt || '').trim().toLowerCase();
          if (crypt) args.push('--crypt=' + (/^(1|yes|true)$/.test(crypt) ? '1' : '0'));
          // locale overrides: Language selects the client .loc, ReportLanguage
          // is the code told to the server (client CLI: --language /
          // --reportlanguage, applied at the config-load stage)
          var lang = String(shard.language || '').trim();
          if (lang) args.push('--language=' + lang);
          var rlang = String(shard.reportlanguage || '').trim();
          if (rlang) args.push('--reportlanguage=' + rlang);
          // protocol byte lists ("<0xaa> <0xbb> ..." grammar, validated by
          // shardchk upstream): SeedOverride replaces the IP-derived login
          // seed, SystemCheckOverride is the 0x03 talk-acknowledge payload
          // (client CLI: --seedoverride / --systemcheckoverride)
          var so = String(shard.seedoverride || '').trim();
          if (so) args.push('--seedoverride=' + so);
          var sco = String(shard.systemcheckoverride || '').trim();
          if (sco) args.push('--systemcheckoverride=' + sco);
          var installer = String(shard.producturl || '').trim();
          // producturl is a plain url (the uo+/xuo+/website+/download+ prefix
          // grammar is gone; empty = manual install, no product flag)
          if (installer) {
            // url product sources cannot be fetched cross-origin from the
            // browser. A MythicMFT manifest root - or a full manifest file
            // url under a /manifest/ directory - keeps the client's own
            // default product lanes: the proxy mirrors the official
            // manifest on /patch/manifest and rewrites the prod's absolute
            // repo urls same-origin (the /stream lane passes the raw prod
            // through, and the browser could never fetch its absolute
            // cross-origin manifestrepos). Anything else routes through the
            // same-origin /stream proxy: the /stream lane decodes its whole
            // remainder once into the upstream url, so the encoded part
            // must be the url's directory (trailing slash literal) and the
            // manifest leaf stays a literal path segment. A bare aops root
            // keeps the trailing / - the client normalizes the root onto
            // <root>patchlist and the proxy rewrites the patchcfg's repo
            // urls back to /stream. Anything that is not a url passes
            // through unchanged
            var target = installer;
            if (/^https?:\/\//i.test(target)) {
              var path = target.replace(/\/+$/, '');
              var at = path.toLowerCase().lastIndexOf('/manifest');
              var isManifestTree =
                at >= 0 &&
                (at + 9 === path.length || path.charAt(at + 9) === '/');
              if (!isManifestTree) {
                var slash = path.lastIndexOf('/');
                var bare = slash >= 0 && path.indexOf('.', slash) === -1;
                if (bare) {
                  path = path.replace(/\/patch(?:list|cfg)$/i, '');
                  args.push('--streaming-product=/stream/' + encodeURIComponent(path) + '/');
                } else {
                  // encode the directory only: the leaf stays a literal
                  // segment so the client sees a full manifest file url
                  args.push(
                    '--streaming-product=/stream/' + encodeURIComponent(path.slice(0, slash)) +
                    path.slice(slash));
                }
              }
            } else if (target.charAt(0) !== '/') {
              // deployment-local data mount (xuoproxy --data <name>=<dir>):
              // "local:<name>" sugar or any bare relative value maps to the
              // same-origin /data/<name>/ lane the proxy serves (generated
              // MythicMFT product); leading-'/' values are explicit
              // page-absolute product urls and pass through unchanged. A
              // '..' segment is refused outright - the client would only
              // 404 on it, but a locked deployment's producturl is trusted
              // input and stays that way
              var mount = target.replace(/^local:/i, '');
              if (mount.charAt(0) === '/') {
                // an absolute path is a SERVER-SIDE reference
                // ("ProductUrl=local:/home/shard/client"): xuoproxy mounts it
                // and rewrites the served shards.cfg to /data/<mount>/. If
                // the raw value still reaches this page, shards.cfg was
                // served by something that cannot rewrite it (an older
                // proxy, a static server) - the browser can never read a
                // host path, so skip the product flag rather than fetch a
                // garbage url
                console.warn('[shards] producturl "' + installer +
                             '" is a host path but was not rewritten by the' +
                             ' proxy (shards.cfg must be served BY' +
                             ' xuoproxy) - no streaming product');
              } else {
                mount = mount
                  .replace(/(?:^|\/)\.(?:\/|$)/g, '/') // drop ./ segments
                  .replace(/\/{2,}/g, '/')
                  .replace(/^\/+|\/+$/g, '');
                if (mount && !/(^|\/)\.\.(?:\/|$)/.test(mount)) {
                  args.push('--streaming-product=/data/' + mount + '/');
                }
              }
            } else {
              args.push('--streaming-product=' + target);
            }
          }
          return args;
        }

        // ---- boot gating ----------------------------------------------------

        // login address/port vectors in the query passthrough, matched on the
        // raw AND the percent-decoded pair so encoding cannot smuggle one
        // past: --host/--port in every popts form (--flag=v, "--flag" bare
        // consuming the next argv, -f=v, -fv attached) plus the shell's own
        // testing params (which buildClientArgs would translate into
        // --host/--port below)
        function isLoginOverrideArg(kv) {
          return /^--ho(?:st)?(?:=|$)/.test(kv) ||
                 /^--po(?:rt)?(?:=|$)/.test(kv) ||
                 /^-[sp]/.test(kv) ||
                 /^shard-(?:address|port)=/.test(kv);
        }

        // final argument assembly (moved out of the boot IIFE above so the
        // chosen shard's flags merge in BEFORE crossuo.js loads). Order
        // matters: popts keeps the LAST value of a repeated flag, so the
        // testing overrides (?shard-address/?shard-port) go last and win
        // over the shard entry's own --host/--port. In locked mode both
        // override mechanisms are dead: the single-shard deployment's
        // shards.cfg loginserver is the only login endpoint the page will
        // ever hand the client
        function buildClientArgs(extraArgs) {
          var args = ['./crossuo'];
          var q = window.location.search.substring(1);
          if (q) {
            q.split('&').forEach(function (kv) {
              if (!kv) return;
              // a malformed %-escape must never prevent boot: on decode throw
              // push the RAW pair (the client tolerates junk args)
              var dec;
              try {
                dec = decodeURIComponent(kv);
              } catch (e) {
                dec = kv;
              }
              if (lockedMode &&
                  (isLoginOverrideArg(kv) || isLoginOverrideArg(dec))) return;
              args.push(dec);
            });
          }
          if (extraArgs) args.push.apply(args, extraArgs);
          // ?diag=1 turns on the client's hex packet dump too
          // (--packet-dump): every network packet, both directions, with the
          // account/password block censored. Diagnostics must not fight the
          // locked deployment, so it is a plain appended flag (never a login
          // override) and the query passthrough cannot set it twice - popts
          // keeps the last value and this one is last
          if (params.get('diag') === '1') args.push('--packet-dump');
          if (!lockedMode) {
            // shard address override for the ws proxy (testing): maps to the
            // client's login-server override flags (LoadLogin consults them)
            var shardAddr = params.get('shard-address');
            var shardPort = params.get('shard-port');
            if (shardAddr) args.push('--host=' + shardAddr);
            if (shardPort) args.push('--port=' + shardPort);
          }
          return args;
        }

        // ---- streaming download accounting ----------------------------------
        // The counters live in the wasm's static memory (xuocore/http.h:
        // vfs_web_progress_counters). Reading them needs NO exported getter:
        // in PROXY_TO_PTHREAD builds the module (and its exports) bind on the
        // worker, so page-side calls into _vfs_web_bytes_* resolve to nothing.
        // Instead _vfs_web_progress_addrs hands over the static pair's
        // address and the poll reads the two i64s straight through HEAPU64 -
        // pthread builds share one heap across the page, main and workers,
        // so the reads see the live values wherever the writes happened.
        //
        // Two render modes, driven purely by the two counters:
        //   percent    done <= total (the bounded boot plan): "streaming
        //              250 / 730 MB (34%)"
        //   throughput done >  total (the open-ended in-game sweep, whose
        //              denominator the client never registers): "streaming
        //              12.4 MB/s (sweep +180 MB, repeats uncounted)" - the
        //              rolling rate plus this session's unique-transfer
        //              volume. The LIFETIME counter is never rendered here:
        //              a lifetime total reads as data volume and unmoors
        //              with re-fetch churn (cache re-serves, retry cycles),
        //              which is exactly the nonsense-magnitude failure mode.
        // The overlay stays visible while bytes move (any done delta over the
        // last STREAM_IDLE_MS) OR while percent-mode has frac in [0.01,0.98];
        // it hides only when idle or before the first byte. There is NO
        // frac<0.99 hide: the throughput sweep runs for minutes after the
        // bounded plan clamps and must stay on screen.
        //
        // ES5 only: BigInt shows up purely as values (Number()-ed below).
        var STREAM_RATE_SAMPLES = 4;  // 4 samples x 500ms poll => ~2s window
        var STREAM_IDLE_MS = 3000;    // no delta for 3s => considered idle
        var streamAddr = -1; // -1 = not resolved yet, 0 = unavailable
        var streamDonePrev = -1;
        var streamSessionBase = -1; // counter value at first sighting (session delta base)
        var streamMovedAt = 0;
        var streamSamples = []; // [{t:ms, d:bytes}] rolling rate window
        var streamEl = null;
        var streamTimer = 0;
        var streamBar = null; // lazily created fixed progress bar
        function streamCounter(wordIndex) {
          // re-fetch the view every poll: memory growth detaches old ones
          // (emscripten re-publishes Module.HEAPU64 on growth)
          var heap = Module.HEAPU64;
          if (!heap || streamAddr <= 0) return -1;
          return Number(heap[(streamAddr >> 3) + wordIndex]);
        }
        function resolveStreamAddr() {
          if (streamAddr !== -1) return; // resolved once (0 = unavailable)
          if (typeof Module._vfs_web_progress_addrs !== 'function')
            return; // runtime not booted yet - retry on the next tick
          try {
            streamAddr = Number(Module._vfs_web_progress_addrs()) || 0;
          } catch (e) {
            streamAddr = 0; // never available - stop asking
          }
        }
        // bytes -> "B"/"KB"/"MB"/"GB" with one decimal (pure)
        function formatBytes(n) {
          n = Number(n) || 0;
          if (n < 1024) return n.toFixed(1) + ' B';
          if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
          if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
          return (n / 1073741824).toFixed(1) + ' GB';
        }
        // bytes/sec -> rate string, MB/s or GB/s automatically (pure)
        function formatRate(bps) {
          bps = Number(bps) || 0;
          if (bps < 0) bps = 0; // never render a negative rate
          if (!isFinite(bps) || bps < 1048576) // sub-MB stays on the MB/s line
            return (bps / 1048576).toFixed(1) + ' MB/s';
          if (bps < 1073741824) return (bps / 1048576).toFixed(1) + ' MB/s';
          return (bps / 1073741824).toFixed(1) + ' GB/s';
        }
        // the whole display decision, kept pure for the node harness: takes the
        // raw counters + now() + the rolling sample window, returns
        // {show, text, samples}. samples is the (possibly updated) window.
        function streamDisplay(done, total, now, samples) {
          var i;
          if (done !== streamDonePrev) { // bytes are moving right now
            streamDonePrev = done;
            streamMovedAt = now;
          }
          // rolling window: append the fresh sample, drop the stale tail
          samples = samples ? samples.slice(0) : [];
          samples.push({ t: now, d: done });
          while (samples.length > STREAM_RATE_SAMPLES) samples.shift();
          // throughput over the window; guarded against a zero/negative span
          var rate = 0;
          if (samples.length >= 2) {
            var first = samples[0];
            var last = samples[samples.length - 1];
            var dt = (last.t - first.t) / 1000;
            if (dt > 0 && last.d >= first.d) rate = (last.d - first.d) / dt;
          }
          var moving = now - streamMovedAt < STREAM_IDLE_MS;
          var frac = total > 0 && done > 0 ? done / total : 0;
          if (done > 0 && streamSessionBase < 0) streamSessionBase = done;
          var out;
          if (done > 0 && total > 0 && done <= total) { // percent mode
            out = { show: moving || (frac >= 0.01 && frac <= 0.98),
                    text: 'streaming ' + formatBytes(done) + ' / ' +
                          formatBytes(total) + ' (' +
                          Math.round(frac * 100) + '%)' };
          } else if (done > 0) { // throughput mode (open-ended sweep)
            // rolling rate + this session's unique-transfer volume; the
            // lifetime counter stays off the screen (see the mode notes)
            var session = Math.max(0, done - streamSessionBase);
            out = { show: moving,
                    text: 'loaded ' + formatBytes(session) + ' (streaming ' + formatRate(rate) + ')'};
          } else { // nothing fetched yet
            out = { show: false, text: null };
          }
          out.samples = samples;
          return out;
        }
        // create the fixed bar once; DOM placement is cosmetic (position:fixed)
        function ensureStreamBar() {
          if (streamBar) return streamBar;
          var canvas = document.getElementById('canvas');
          if (!canvas) return null;
          streamBar = document.createElement('div');
          streamBar.id = 'streamBar';
          var fill = document.createElement('div');
          fill.id = 'streamBarFill';
          var text = document.createElement('div');
          text.id = 'streamBarText';
          streamBar.appendChild(fill);
          streamBar.appendChild(text);
          canvas.insertAdjacentElement('afterend', streamBar);
          return streamBar;
        }
        // re-anchor to the canvas rect + drive fill/label from the display mode
        function updateStreamBar(show, text, percent, indeterminate) {
          var bar = ensureStreamBar();
          if (!bar) return;
          if (!show) { bar.style.display = 'none'; return; }
          var canvas = document.getElementById('canvas');
          if (canvas) {
            var r = canvas.getBoundingClientRect();
            bar.style.left = r.left + 'px';
            bar.style.width = r.width + 'px';
            bar.style.top = Math.min(r.bottom + 6,
                                     window.innerHeight - 22) + 'px';
          }
          var fill = document.getElementById('streamBarFill');
          if (percent) {
            if (fill) fill.style.width = (percent * 100) + '%';
            bar.className = '';
          } else { // throughput: full fill + pulse
            if (fill) fill.style.width = '100%';
            bar.className = 'indet';
          }
          var textEl = document.getElementById('streamBarText');
          if (textEl) textEl.textContent = text;
          bar.style.transform = 'translateZ(0)'; // force a fresh anchor paint
          bar.style.display = 'block';
        }
        function pollStreamProgress() {
          resolveStreamAddr();
          var done = streamCounter(0);
          if (done < 0) return; // runtime not up (or native: addr 0)
          var total = streamCounter(1);
          var r = streamDisplay(done, total, Date.now(), streamSamples);
          streamSamples = r.samples;
          var show = r.show;
          var text = r.text;
          var statusNow = document.getElementById('status');
          if (statusNow) { // ?log=1 furniture: write the compact line there
            if (show) statusNow.textContent = text;
          } else {         // bare page: tiny non-intrusive overlay line only
            if (!streamEl) {
              streamEl = document.createElement('div');
              streamEl.style.cssText =
                'position:fixed;left:8px;bottom:6px;z-index:5;' +
                'font:11px monospace;color:#aab;opacity:.75;' +
                'pointer-events:none;text-shadow:0 1px 2px #000';
              document.body.appendChild(streamEl);
            }
            streamEl.textContent = show ? text : '';
            streamEl.style.display = show ? 'block' : 'none';
          }
          // graphical bar, same visibility rules as the text overlay.
          // percent mode (done <= total, total > 0): growing fill, no pulse.
          // throughput mode (done > total): full fill + pulse.
          var frac = total > 0 && done > 0 ? done / total : 0;
          updateStreamBar(show, text, done <= total ? frac : 0, done > total);
        }
        function startStreamPolling() {
          if (streamTimer) return;
          pollStreamProgress();
          streamTimer = setInterval(pollStreamProgress, 500);
          // resize just re-anchors; the 500ms tick keeps fill/label current
          window.addEventListener('resize', function () {
            if (streamBar && streamBar.style.display !== 'none')
              pollStreamProgress();
          }, false);
        }

        // idempotent: every path (picker Play, deep link, fallback) funnels
        // here and the module boots exactly once
        function bootClient(extraArgs) {
          if (booted) return;
          booted = true;
          hidePicker();
          startStreamPolling();
          // Module.arguments must be FINAL before the glue runs (consumed
          // once at runtime init)
          Module.arguments = buildClientArgs(extraArgs);
          // warm the OPFS blob cache into MEMFS first: the client then finds
          // the blobs on disk instead of issuing one cached XHR per file.
          // Bounded (OPFS_RESTORE_MS) and failure-proof - a miss is just a
          // cache miss, the fetch path takes over
          var shardName = '';
          for (var i = 0; i < Module.arguments.length; ++i) {
            var a = String(Module.arguments[i]);
            if (a.indexOf('--shard=') === 0) shardName = a.slice(8);
          }
          var startRuntime = function () {
            var s = document.createElement('script');
            s.src = 'crossuo.js';
            s.async = true;
            document.body.appendChild(s);
          };
          var prepare = (Module.opfsBootPrepare ? Module.opfsBootPrepare(shardName)
                                                : Promise.resolve(0));
          prepare.then(startRuntime, startRuntime); // the cache never blocks a boot
        }

        function setPageStatus(text) {
          // #status only exists with ?log=1 (the boot IIFE removes it
          // otherwise); the picker panel carries its own state line
          var el = document.getElementById('status');
          if (el) el.textContent = text;
        }

        // ---- shards.cfg loading ---------------------------------------------

        function shardSources() {
          // ?shards=<url> replaces the whole source list (testing)
          var override = params.get('shards');
          if (override) return [override];
          // same-origin first (deployments may vendor shards.cfg next to
          // index.html), then the curated list on GitHub (CORS-enabled)
          return ['shards.cfg',
                  'https://raw.githubusercontent.com/crossuo/shards/master/shards.cfg'];
        }

        function fetchText(url, cb) {
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          // 10s cap: shard infra must never delay the boot indefinitely
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 10000) : null;
          var opts = { credentials: 'omit' };
          if (ctrl) opts.signal = ctrl.signal;
          fetch(url, opts)
            .then(function (r) {
              if (!r.ok) throw new Error('http ' + r.status);
              return r.text();
            })
            .then(function (text) {
              if (timer) clearTimeout(timer);
              cb(null, text);
            })
            .catch(function (err) {
              if (timer) clearTimeout(timer);
              cb(err);
            });
        }

        // the first source that fetches AND parses into >= 1 shard wins;
        // every failure falls through, exhausted sources => fallback mode.
        // The winning source is reported (2nd cb arg) so the caller can
        // engage the single-shard lock when a deployment's OWN shards.cfg
        // (same-origin) carries exactly one entry.
        //
        // With a ?shards= override the same-origin file is still probed
        // first - but ONLY as a lock candidate: a single-entry shards.cfg
        // wins over the override (an override must never defeat the lock),
        // anything else defers to the override so testing keeps working
        // (no lock, unchanged semantics)
        function loadShards(cb) {
          var override = params.get('shards');
          var sources = override ? ['shards.cfg', override] : shardSources();
          (function next(i) {
            if (i >= sources.length) {
              console.warn('[shards] no usable shards.cfg source');
              return cb(new Error('shards unavailable'), null);
            }
            fetchText(sources[i], function (err, text) {
              var list = [];
              if (!err) {
                try {
                  list = parseShardsIni(text, function (msg) { console.warn(msg); });
                } catch (e) { err = e; }
              }
              if (override && sources[i] === 'shards.cfg') {
                if (!err && list.length === 1) return cb(null, list, sources[i]);
                if (!err && list.length)
                  console.warn('[shards] lock probe: multi-entry shards.cfg,' +
                               ' honoring the ?shards= override');
                return next(i + 1);
              }
              if (err || !list.length) {
                console.warn('[shards] source unusable:', sources[i], err || 'empty');
                return next(i + 1);
              }
              if (WEBLOG) console.log('[shards] ' + list.length + ' shards from ' + sources[i]);
              cb(null, list, sources[i]);
            });
          })(0);
        }

        // ?shard=<name|index>: case-insensitive name match first, then a
        // 0-based numeric index into the loaded list
        function resolveShard(key) {
          var want = String(key).toLowerCase();
          for (var i = 0; i < shards.length; i++) {
            if (String(shards[i].shardname).toLowerCase() === want) return shards[i];
          }
          if (/^\d+$/.test(want)) {
            var n = parseInt(want, 10);
            if (n < shards.length) return shards[n];
          }
          return null;
        }

        // ---- picker UI ------------------------------------------------------

        function hidePicker() {
          if (ui && ui.overlay.parentNode) ui.overlay.parentNode.removeChild(ui.overlay);
          ui = null;
        }

        // entries sorted for display: highlighted ('highlighted' tag) first,
        // stable so the manifest order is preserved within each group. Returns
        // a new array of {entry, featured, displayTags} so the manifest order
        // (and shardToArgs(entry)) is untouched.
        function pickerEntries(list) {
          var hi = [];
          var lo = [];
          for (var i = 0; i < list.length; i++) {
            var entry = list[i];
            var tags = entry.tags ? String(entry.tags).split(',') : [];
            var featured = false;
            var shown = [];
            for (var t = 0; t < tags.length; t++) {
              var tok = tags[t].replace(/^[ \t]+|[ \t]+$/g, '');
              if (!tok) continue;
              if (tok.toLowerCase() === 'highlighted') { featured = true; continue; }
              shown.push(tok);
            }
            var item = { entry: entry, featured: featured, displayTags: shown.join(',') };
            (featured ? hi : lo).push(item);
          }
          return hi.concat(lo);
        }

        function select(i) {
          selected = i;
          if (!ui) return;
          var rows = ui.list.childNodes;
          for (var k = 0; k < rows.length; k++) {
            rows[k].classList[k === i ? 'add' : 'remove']('sel');
          }
          ui.play.disabled = i < 0; // only an empty list keeps Play disabled
        }

        function play(i) {
          var item = i >= 0 ? view[i] : null;
          var entry = item ? item.entry : null;
          if (!entry || booted) return;
          setPageStatus('starting ' + entry.shardname + '\u2026');
          if (ui) ui.state.textContent = 'starting ' + entry.shardname + '\u2026';
          bootClient(shardToArgs(entry));
        }

        function showPicker() {
          if (booted || ui) return;
          // display order: highlighted first (promoted), manifest order kept
          view = pickerEntries(shards);
          var overlay = document.createElement('div');
          overlay.id = 'shardPicker';
          overlay.tabIndex = 0;
          var panel = document.createElement('div');
          panel.className = 'panel';
          var title = document.createElement('div');
          title.className = 'title';
          title.textContent = 'Choose a Shard';
          var list = document.createElement('div');
          list.className = 'list';
          var footer = document.createElement('div');
          footer.className = 'footer';
          var state = document.createElement('div');
          state.className = 'state';
          var buttons = document.createElement('div');
          buttons.className = 'buttons';
          var playBtn = document.createElement('button');
          playBtn.textContent = 'Play';
          playBtn.disabled = true;
          playBtn.addEventListener('click', function () { play(selected); });
          for (var i = 0; i < view.length; i++) {
            (function (i) {
              var item = view[i];
              var row = document.createElement('div');
              row.className = item.featured ? 'row featured' : 'row';
              // text column (name + sub line); the optional card action sits
              // after it, right-aligned by the row's flex layout
              var main = document.createElement('div');
              main.className = 'rowmain';
              var name = document.createElement('div');
              name.className = 'name';
              // highlighted entries carry a star prefix; name stays raw otherwise
              name.textContent = (item.featured ? '\u2605 ' : '') + item.entry.shardname;
              main.appendChild(name);
              // sub line: the shard's WEB url (a clickable link), not the raw
              // login address - the picker only shows when there is more than
              // one shard, and the address means nothing to the player. Falls
              // back to the loginserver when the shard has no url.
              var url = String(item.entry.shardweb || '').trim();
              var sub = item.entry.loginserver || '';
              if (url) sub = url;
              var tagsLine = item.displayTags
                ? (sub ? ' \u00b7 ' + item.displayTags : item.displayTags)
                : '';
              if (sub || item.displayTags) {
                var subEl = document.createElement('div');
                subEl.className = 'sub';
                if (url) {
                  // only http(s) urls are linkified (a bare value must not
                  // become a javascript: or relative href)
                  var link = document.createElement('a');
                  if (/^https?:\/\//i.test(url)) {
                    link.href = url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    // a click on the link must not also select/play the row
                    link.addEventListener('click', function (e) { e.stopPropagation(); });
                  }
                  link.textContent = url;
                  subEl.appendChild(link);
                } else {
                  subEl.textContent = sub;
                }
                if (item.displayTags) {
                  subEl.appendChild(document.createTextNode(
                    (sub ? ' \u00b7 ' : '') + item.displayTags));
                }
                main.appendChild(subEl);
              }
              row.appendChild(main);
              // autoacct (default yes): when a shard does not create the
              // account on first login, offer a Create account button that
              // opens its registration page. Needs a shardaccount to point at.
              var autoacct = item.entry.autoacct;
              var acctOn = !(autoacct !== undefined && autoacct !== null &&
                             /^(no|false|0)$/i.test(String(autoacct).trim()));
              var reg = String(item.entry.shardaccount || '').trim();
              if (!acctOn && reg && /^https?:\/\//i.test(reg)) {
                var regBtn = document.createElement('button');
                regBtn.className = 'card-action';
                regBtn.textContent = 'Create account';
                regBtn.addEventListener('click', function (e) {
                  e.stopPropagation();
                  window.open(reg, '_blank', 'noopener');
                });
                // the button must not steal the row's select-on-click
                regBtn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
                row.appendChild(regBtn);
              }
              row.addEventListener('click', function () { select(i); });
              row.addEventListener('dblclick', function () { play(i); });
              list.appendChild(row);
            })(i);
          }
          // arrows move the selection, enter plays it
          overlay.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
              e.preventDefault();
              var n = view.length;
              if (!n) return;
              var base = selected < 0 ? (e.key === 'ArrowDown' ? -1 : 0) : selected;
              select((base + (e.key === 'ArrowDown' ? 1 : n - 1)) % n);
            } else if (e.key === 'Enter' && selected >= 0) {
              play(selected);
            }
          });
          buttons.appendChild(playBtn);
          footer.appendChild(state);
          footer.appendChild(buttons);
          panel.appendChild(title);
          panel.appendChild(list);
          panel.appendChild(footer);
          overlay.appendChild(panel);
          document.body.appendChild(overlay);
          ui = { overlay: overlay, list: list, play: playBtn, state: state };
          // pre-selection: the first (promoted) entry is highlighted first by
          // the sort, so it is always the default choice
          select(view.length ? 0 : -1);
          overlay.focus();
        }

        // ---- flow -------------------------------------------------------------

        // single-shard lock: the deployment opted in by serving a one-entry
        // shards.cfg from its own origin. The picker never shows, the boot
        // goes straight to that entry, and buildClientArgs strips every
        // user-controllable login address/port vector (query flags,
        // ?shard-address/?shard-port). The entry's own loginserver maps to
        // --host/--port, which the client's LoadLogin applies ahead of any
        // config file, so the endpoint is pinned.
        function engageLockedShard(list) {
          lockedMode = true;
          shards = list; // resolveShard reads the module-global list
          if (WEBLOG) console.log('[shards] single-shard lock engaged:', list[0].shardname);
          setPageStatus('starting ' + list[0].shardname + '\u2026');
          bootClient(shardToArgs(list[0]));
        }

        // locked = a winning source that is the deployment's own file AND
        // exactly one entry
        function isLockedSource(err, list, source) {
          return !err && source === 'shards.cfg' && !!list && list.length === 1;
        }

        var deepLink = params.get('shard');
        if (deepLink) {
          // deep link: never show the picker - resolve, then boot right away
          setPageStatus('loading shards\u2026');
          loadShards(function (err, list, source) {
            if (isLockedSource(err, list, source)) return engageLockedShard(list);
            shards = list || []; // resolveShard reads the module-global list
            var entry = err ? null : resolveShard(deepLink);
            if (err || !entry)
              console.warn('[shards] ?shard=' + deepLink +
                           (err ? ' unavailable' : ' not found') + ', booting with defaults');
            setPageStatus('starting ' + (entry ? entry.shardname : 'client') + '\u2026');
            bootClient(entry ? shardToArgs(entry) : []);
          });
        } else {
          setPageStatus('loading shards\u2026');
          loadShards(function (err, list, source) {
            if (isLockedSource(err, list, source)) return engageLockedShard(list);
            if (err || !list.length) return bootClient([]); // old behavior
            shards = list;
            showPicker();
          });
        }
      })();
    </script>
  </body>
</html>
