<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CrossUO (web)</title>
    <style>
      html, body { margin: 0; padding: 0; background: #101014; color: #cfd2dc;
                   font-family: system-ui, sans-serif; height: 100%; }
      #wrap { display: flex; flex-direction: column; align-items: center;
              justify-content: center;
              /* safe center: keep the loading layout centered while it fits,
                 but never center an OVERFLOWING stack - centering overflows
                 both edges and a page cannot scroll to negative y, so the
                 maximized (viewport-sized) canvas ended up with its top
                 rows unreachable (measured: rect.top = -24 => the top of the
                 game render cut off). Overflow must fall back to start */
              justify-content: safe center;
              height: 100%; }
      /* once the game maximizes, the canvas alone IS the page: the status/log
         rows must leave the flow, otherwise they extend the document below
         the viewport and the resulting scrollbars shrink the client area
         (vertical scrollbar re-centered the canvas into a 7px horizontal
         cut and a 15px-shorter wrap re-introduced a vertical offset) */
      #wrap.maximized #status, #wrap.maximized #log { display: none; }
      /* no fixed size: SDL/emscripten controls the canvas dimensions
         (SDL_SetWindowSize updates the canvas element size). SDL probes
         the css box with a 1x1 canvas to detect external css sizing and
         adopts whatever it reads when SDL_WINDOW_RESIZABLE - so the css
         box must match the intrinsic size: use an outline (no layout
         impact), never a border (1px border would turn the 1x1 probe
         into a 3x3 bounding box and shrink the window to it) */
      canvas.crossuo { image-rendering: pixelated; background: #000;
                       outline: 1px solid #2a2c36; outline-offset: -1px; }
      #status { margin-top: 8px; font-size: 13px; opacity: .8; }
      #log { margin-top: 8px; font-size: 11px; opacity: .6; white-space: pre;
             height: 4em; overflow: hidden; }
      /* pre-boot shard picker: dependency-free overlay, shown only before
         crossuo.js loads (bootClient removes it); monospace panel matching
         the page's dark scheme */
      #shardPicker { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                     background: rgba(8, 8, 12, .88); z-index: 1000;
                     display: flex; align-items: center; justify-content: center;
                     font-family: ui-monospace, Menlo, Consolas, monospace; }
      #shardPicker .panel { background: #16171d; border: 1px solid #2a2c36;
                            border-radius: 6px; width: 440px; max-width: 92vw;
                            max-height: 76vh; box-sizing: border-box; padding: 14px;
                            display: flex; flex-direction: column; }
      #shardPicker .title { font-size: 14px; color: #e8eaf2; margin-bottom: 10px; }
      #shardPicker .list { flex: 1; min-height: 0; overflow-y: auto;
                           border: 1px solid #2a2c36; }
      #shardPicker .row { padding: 7px 10px; cursor: pointer;
                          border-bottom: 1px solid #20222b; }
      #shardPicker .row:last-child { border-bottom: none; }
      #shardPicker .row:hover { background: #1d1f27; }
      #shardPicker .row.sel,
      #shardPicker .row.sel:hover { background: #24304a; }
      #shardPicker .name { font-size: 13px; color: #dfe3ee; }
      #shardPicker .sub { font-size: 11px; opacity: .65; margin-top: 2px; }
      #shardPicker .footer { margin-top: 12px; }
      #shardPicker .state { font-size: 11px; opacity: .7; min-height: 1em; }
      #shardPicker .buttons { margin-top: 10px; }
      #shardPicker button { background: #24304a; color: #dfe3ee;
                            border: 1px solid #3d5aa8; border-radius: 4px;
                            padding: 6px 14px; font: inherit; font-size: 12px;
                            cursor: pointer; margin-right: 8px; }
      #shardPicker button:disabled { opacity: .4; cursor: default; }
      #shardPicker button:not(:disabled):hover { background: #2c3b5c; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <!-- the emscripten runtime binds to Module.canvas -->
      <canvas class="crossuo" id="canvas" width="640" height="480" tabindex="-1"
              oncontextmenu="event.preventDefault()"></canvas>
      <div id="status">loading&#8230;</div>
      <div id="log"></div>
    </div>
    <script>
      // pthread builds run the runtime before the glue reads this object, so
      // create it up front and attach every handler to the same instance
      var Module = window.Module || {};
      // ?log=1 gate - page-global: the audio and idbfs blocks below live
      // outside the boot IIFE and share it
      var WEBLOG = new URLSearchParams(window.location.search).get('log') === '1';
      // NOTE: Module.preRun does NOT run on the page in PROXY_TO_PTHREAD
      // builds (the boot sequence that consumes it executes on the pthread
      // worker) - everything that must happen on the page lives in the
      // when-ready block below.
      (function () {
        // ?log=1: keep the page furniture (status line + log pane) and mirror
        // every client line to the console. Without it the page ships ONLY
        // the canvas: console.log is a per-line serialization cost and the
        // log pane's textContent += re-copies the whole pane per line, which
        // is measurable at INFO flood rates
        var statusEl = document.getElementById('status');
        var logEl = document.getElementById('log');
        if (!WEBLOG)
        {
          if (statusEl && statusEl.parentNode) statusEl.parentNode.removeChild(statusEl);
          if (logEl && logEl.parentNode) logEl.parentNode.removeChild(logEl);
        }
        function setStatus(text) {
          if (!WEBLOG) return;
          statusEl.textContent = text;
        }
        // pass URL query parameters to the client as command line arguments:
        //   index.html?streaming-product=http://host/patch&streaming-workers=4
        // NOTE: Module.arguments is NOT assembled here anymore - the runtime
        // consumes it once at init and the pre-boot shard picker below must
        // merge the chosen shard's flags in first, so the final assembly
        // moved into buildClientArgs()/bootClient() at the bottom of the page
        Module.canvas = (function () {
          var c = document.getElementById('canvas');
          var scaleMode = new URLSearchParams(window.location.search).get('scale');
          if (scaleMode === 'fixed') {
            c.classList.add('fixed');
          } else {
            c.classList.add('page');
          }
          c.addEventListener('webglcontextlost', function (e) {
            e.preventDefault();
            setStatus('context lost, reloading');
            setTimeout(function () { location.reload(); }, 1000);
          });
          // the maximize (CGameScreen::Init -> MaximizeWindow) sizes the
          // canvas to the viewport; from then on the canvas box alone must
          // own the layout - the loading rows below it would otherwise
          // overflow the flex column (see the .maximized rule above and the
          // safe-center comment). The observer only fires on real box
          // changes, so this is O(1) per canvas resize
          if (typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(function (entries) {
              var r = entries[entries.length - 1].contentRect;
              var full = r.height >= window.innerHeight &&
                         r.width >= window.innerWidth;
              document.getElementById('wrap').classList.toggle('maximized', full);
            }).observe(c);
          }
          return c;
        })();
        Module.setStatus = function (text) {
          if (text && WEBLOG) statusEl.textContent = text;
        };
        // ?diag=1: main-thread responsiveness probe. A blocked main thread
        // (a huge IndexedDB persist, a proxied GL storm) shows up as
        // heartbeat gaps far above the timer interval together with a
        // collapsing requestAnimationFrame cadence.
        if (new URLSearchParams(window.location.search).get('diag') === '1') {
          var lastBeat = performance.now(), worstBeat = 0;
          var lastFrame = performance.now(), worstFrame = 0, frames = 0;
          // ?diag=1 also instruments the PRESENT path: with
          // PROXY_TO_PTHREAD + OFFSCREEN_FRAMEBUFFER the client renders on
          // the worker into an offscreen framebuffer and emscripten's
          // commit_frame blits it to the visible canvas here, on the main
          // thread. Wrapping the context lets the beat prove the blit
          // cadence (draws/blits keep flowing) or catch it stopping, and
          // logs the canvas element vs drawingBuffer vs CSS sizes (a
          // degenerate or mismatched destination explains invisible
          // output and emscripten's "destination rect smaller than the
          // viewport rect" warning).
          var glStats = { draws: 0, clears: 0, blits: 0, texUp: 0, fbblit: 0, bindNull: 0, viewports: 0 };
          var glCtx = null;
          // per-context tallies keyed by canvas identity: a second GL context
          // (another canvas, or a second context on the same canvas) shows up
          // here as a second entry even though emscripten keeps only its
          // current one
          var glPerCtx = [];
          var glCtxId = function (ctx) {
            var c = ctx && ctx.canvas;
            return (c && (c.id || c.className || 'anon-canvas')) + '#' +
                   (c ? c.width + 'x' + c.height : '?');
          };
          (function () {
            var hookCtx = function (ctx) {
              if (!ctx || ctx.__xuoDiagHooked) return;
              ctx.__xuoDiagHooked = true;
              var tally = { id: glCtxId(ctx), draws: 0, bindNull: 0, blits: 0, texUp: 0, clears: 0 };
              glPerCtx.push(tally);
              if (glCtx == null) glCtx = ctx; // first context = the game canvas
              ['drawArrays', 'drawArraysInstanced', 'drawElements',
               'drawElementsInstanced'].forEach(function (name) {
                var orig = ctx[name];
                ctx[name] = function (mode, a1, a2) {
                  tally.draws++;
                  glStats.draws++;
                  if (name === 'drawArrays' && mode === 5 && a2 === 4) glStats.fbblit++;
                  return orig.call(ctx, mode, a1, a2);
                };
              });
              ['texImage2D', 'texSubImage2D', 'texImage3D', 'texSubImage3D',
               'copyTexImage2D', 'copyTexSubImage2D'].forEach(function (name) {
                var orig = ctx[name];
                ctx[name] = function () {
                  tally.texUp++;
                  glStats.texUp++;
                  return orig.apply(ctx, arguments);
                };
              });
              ['clear', 'blitFramebuffer'].forEach(function (name) {
                var orig = ctx[name];
                ctx[name] = function () {
                  tally[name === 'clear' ? 'clears' : 'blits']++;
                  glStats[name === 'clear' ? 'clears' : 'blits']++;
                  return orig.apply(ctx, arguments);
                };
              });
              (function () {
                var orig = ctx.bindFramebuffer;
                ctx.bindFramebuffer = function (target, fb) {
                  if (fb === null) { tally.bindNull++; glStats.bindNull++; }
                  return orig.call(ctx, target, fb);
                };
              })();
            };
            var wrapGetContext = function (proto) {
              if (!proto) return;
              var origGetContext = proto.getContext;
              proto.getContext = function (type) {
                var ctx = origGetContext.apply(this, arguments);
                try {
                  if (ctx && typeof type === 'string' && type.indexOf('webgl') === 0) {
                    hookCtx(ctx);
                    console.log('[diag-gl] getContext(' + type + ') on ' + glCtxId(ctx));
                  }
                } catch (e) { /* diagnostics must never break the context */ }
                return ctx;
              };
            };
            wrapGetContext(HTMLCanvasElement.prototype);
            if (typeof OffscreenCanvas !== 'undefined') wrapGetContext(OffscreenCanvas.prototype);
          })();
          setInterval(function () {
            var now = performance.now(), gap = now - lastBeat;
            lastBeat = now;
            if (gap > worstBeat) worstBeat = gap;
            var line = '[diag] beat ' + gap.toFixed(0) + 'ms (worst ' + worstBeat.toFixed(0) +
                       'ms), rAF ' + frames + ' (worst frame gap ' + worstFrame.toFixed(0) + 'ms)';
            frames = 0; worstFrame = 0;
            if (glCtx != null) {
              var rect = glCtx.canvas.getBoundingClientRect();
              var st = '';
              try {
                // module context state: viewport, FBO binding, error flag
                st = ' vp=' + JSON.stringify(glCtx.getParameter(0x0BA2)) +
                     ' fboNull=' + (glCtx.getParameter(0x8CA6) === null) +
                     ' glerr=' + glCtx.getError();
              } catch (e) { st = ' state-err'; }
              line += ' | [diag-gl] draws=' + glStats.draws + ' clears=' + glStats.clears +
                      ' blits=' + glStats.blits + ' fbblit=' + glStats.fbblit +
                      ' bindNull=' + glStats.bindNull +
                      ' texUp=' + glStats.texUp +
                      ' canvas=' + glCtx.canvas.width + 'x' + glCtx.canvas.height +
                      ' buf=' + glCtx.drawingBufferWidth + 'x' + glCtx.drawingBufferHeight +
                      ' css=' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
                      ' top=' + Math.round(rect.top) + ' left=' + Math.round(rect.left) +
                      ' dpr=' + window.devicePixelRatio + ' scrollY=' + window.scrollY +
                      ' inner=' + window.innerWidth + 'x' + window.innerHeight +
                      ' scrollH=' + document.documentElement.scrollHeight + st;
              try {
                // where does the layout put the canvas box? (the element can
                // sit partially outside the page while its bitmap is intact)
                var wrapR = document.getElementById('wrap').getBoundingClientRect();
                line += ' wrap=' + Math.round(wrapR.top) + '+' + Math.round(wrapR.height) +
                        ' bodyMargin=' + getComputedStyle(document.body).margin;
              } catch (e) { /* diagnostics only */ }
              var per = '';
              for (var i = 0; i < glPerCtx.length; i++) {
                var t = glPerCtx[i];
                per += ' ctx[' + t.id + ']d=' + t.draws + '/null=' + t.bindNull;
                t.draws = 0; t.bindNull = 0; t.texUp = 0; t.clears = 0; t.blits = 0;
              }
              // canvas-content ground truth: draw the GL canvas into a 2D
              // canvas (works because the context preserves the drawing
              // buffer) and sample mean luminance of a 16x16 thumbnail. If
              // this stays frozen while commits blit, the OFB itself is
              // stale; if it changes but captureScreenshot does not, the
              // browser compositor is at fault.
              var content = '';
              try {
                var c2 = document.createElement('canvas');
                c2.width = 16;
                c2.height = 16;
                var g2 = c2.getContext('2d');
                g2.drawImage(glCtx.canvas, 0, 0, 16, 16);
                var d = g2.getImageData(0, 0, 16, 16).data;
                var lum = 0;
                for (var i = 0; i < d.length; i += 4) {
                  lum += (d[i] + d[i + 1] + d[i + 2]) / 3;
                }
                content = ' content16=' + Math.round(lum / (d.length / 4));
                // row luminance profile of the VISIBLE canvas content: the
                // first/last non-black row tell whether the render reaches
                // the element edges. Compared with rect.top this separates
                // "the element box sits outside the page viewport" (content
                // complete, top != 0) from "the render is offset inside the
                // canvas" (topRow > 0 with top == 0).
                c2.width = 256;
                c2.height = Math.max(1, Math.round(256 * glCtx.canvas.height / glCtx.canvas.width));
                g2.drawImage(glCtx.canvas, 0, 0, c2.width, c2.height);
                var rows = g2.getImageData(0, 0, c2.width, c2.height).data;
                var rowLum = function (y) {
                  var s = 0;
                  for (var x = 0; x < c2.width; x++) {
                    var o = (y * c2.width + x) * 4;
                    s += (rows[o] + rows[o + 1] + rows[o + 2]) / 3;
                  }
                  return s / c2.width;
                };
                var first = -1, last = -1;
                for (var y = 0; y < c2.height; y++) {
                  if (rowLum(y) > 1) { if (first < 0) first = y; last = y; }
                }
                var topBand = 0, botBand = 0, band = Math.min(8, c2.height);
                for (var y2 = 0; y2 < band; y2++) { topBand += rowLum(y2); botBand += rowLum(c2.height - 1 - y2); }
                content += ' rowProfile=' + first + '..' + last + '/' + c2.height +
                           ' top8=' + Math.round(topBand / band) + ' bot8=' + Math.round(botBand / band);
              } catch (e) { content = ' content-err'; }
              line += per + content;
              glStats.draws = 0; glStats.clears = 0; glStats.blits = 0; glStats.texUp = 0;
              glStats.fbblit = 0; glStats.bindNull = 0; glStats.viewports = 0;
            }
            // audio meters (?diag=1): context state, ring fill level and the
            // RMS of what the ScriptProcessorNode actually output since the
            // last beat. Non-zero RMS while music/sfx play == audible signal.
            var au = window.__xuoAudio;
            if (au) {
              var avgRms = au.rmsCount ? (au.rmsSum / au.rmsCount) : 0;
              line += ' | [diag-audio] state=' + au.ctx.state +
                      ' unlocked=' + (au.unlocked ? 1 : 0) +
                      (au.words ? ' ring=yes' : ' ring=no') +
                      ' fill=' + au.fill + '/' + au.cap +
                      ' cb=' + au.callbacks + ' underruns=' + au.underruns +
                      ' rms=' + avgRms.toFixed(5) + ' (peak ' + au.rmsPeak.toFixed(5) +
                      ' over ' + au.rmsCount + ' cb)';
              au.rmsSum = 0; au.rmsCount = 0; au.rmsPeak = 0;
            }
            console.log(line);
          }, 5000);
          (function loop() {
            var now = performance.now(), gap = now - lastFrame;
            lastFrame = now;
            if (gap > worstFrame) worstFrame = gap;
            frames++;
            requestAnimationFrame(loop);
          })();
        }
        Module.print = function (text) {
          if (!WEBLOG) return;
          console.log(text);
          logEl.textContent += text + '\n';
          logEl.scrollTop = logEl.scrollHeight;
        };
        Module.printErr = function (text) {
          if (!WEBLOG) return;
          console.error(text);
          logEl.textContent += text + '\n';
          logEl.scrollTop = logEl.scrollHeight;
        };
        Module.onRuntimeInitialized = function () {
          setStatus('running');
          Module.print('ARGS: ' + JSON.stringify(Module.arguments));
        };
        window.addEventListener('error', function (e) {
          if (!WEBLOG) return;
          var t = (e.error && e.error.stack) ? e.error.stack : e.message;
          logEl.textContent += 'EXCEPTION: ' + t + '\n';
        });
      })();
      // Web Audio output. The AudioContext MUST live on this (DOM) thread:
      // (a) autoplay policies require a user gesture and the gesture happens
      // here, (b) the pthread worker has no audio device (the earlier attempt
      // to let SDL2 create the context inside the worker crashed on
      // Module.SDL2.audioContext). The context is created suspended at page
      // load (the hardware sample rate is readable right away - the sound
      // system inits SoLoud to it before any gesture) and the first
      // pointerdown/keydown resumes it; CDP-dispatched input counts as a
      // gesture. PCM travels through a SharedArrayBuffer ring the pthread
      // worker fills from SoLoud's manual mixer (SoundManager web backend):
      //
      //   [0] writeIdx (frames, worker)   [1] readIdx (frames, here)
      //   [2] capacity (frames)           [3] context sampleRate (here)
      //   [4] unlocked (here)             [5] context running (here)
      //   [6] underrun callbacks (here)   [7] magic 'XUA1'
      //   float32 area @ byte 32: capacity * 2 interleaved stereo samples
      //
      // A ScriptProcessorNode pulls the ring (deprecated but universal and
      // needs no extra module file in dist; an AudioWorklet would read the
      // same ring - swap it in later without touching the worker side).
      (function () {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || !window.SharedArrayBuffer) {
          console.warn('[audio] WebAudio/SAB unavailable, web sound disabled');
          return;
        }
        var ctx = new AC();
        var node = ctx.createScriptProcessor(4096, 2, 2);
        var analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        node.connect(analyser);
        analyser.connect(ctx.destination);
        var td = new Float32Array(analyser.fftSize);
        var audio = (window.__xuoAudio = {
          ctx: ctx,
          unlocked: false,
          ring: null,
          words: null,
          samples: null,
          cap: 0,
          read: 0,
          callbacks: 0,
          underruns: 0,
          // rolling RMS of what this node actually output (diag beat reads
          // and resets these)
          rmsSum: 0,
          rmsCount: 0,
          rmsPeak: 0,
          fill: -1
        });
        node.onaudioprocess = function (e) {
          audio.callbacks++;
          var out = e.outputBuffer;
          var L = out.getChannelData(0);
          var R = out.getChannelData(1);
          var w = audio.words;
          if (!w || !audio.unlocked) {
            L.fill(0);
            R.fill(0);
            return;
          }
          var n = L.length;
          // wrap-safe (both counters are Int32 and advance together)
          var avail = (Atomics.load(w, 0) - Atomics.load(w, 1)) | 0;
          var got = avail < n ? avail : n;
          if (got > 0) {
            var s = audio.samples;
            var cap = audio.cap;
            var r = audio.read % cap;
            for (var i = 0; i < got; i++) {
              var o = ((r + i) % cap) * 2;
              L[i] = s[o];
              R[i] = s[o + 1];
            }
            audio.read = (audio.read + got) | 0;
            Atomics.store(w, 1, audio.read);
          }
          if (got < n) {
            // underrun: render silence for the remainder (a worker stall or
            // a hidden tab - rAF stops, the pump stops, the ring drains)
            L.fill(0, got);
            R.fill(0, got);
            Atomics.add(w, 6, 1);
            audio.underruns++;
          }
          audio.fill = avail;
          // meters: RMS of the actual output (non-zero => audible signal)
          try {
            analyser.getFloatTimeDomainData(td);
            var sq = 0;
            for (var j = 0; j < td.length; j++) sq += td[j] * td[j];
            var rms = Math.sqrt(sq / td.length);
            audio.rmsSum += rms;
            audio.rmsCount++;
            if (rms > audio.rmsPeak) audio.rmsPeak = rms;
          } catch (err) { /* meters must never break the callback */ }
        };
        var words = null;
        function publishState() {
          if (words) {
            Atomics.store(words, 4, audio.unlocked ? 1 : 0);
            Atomics.store(words, 5, ctx.state === 'running' ? 1 : 0);
          }
        }
        function unlock() {
          if (audio.unlocked) return;
          audio.unlocked = true;
          publishState();
          ctx.resume().then(publishState).catch(function (err) {
            console.warn('[audio] resume rejected:', err);
          });
          if (WEBLOG) console.log('[audio] unlocked (gesture), context state=' + ctx.state);
        }
        // capture phase: gestures anywhere on the page count
        window.addEventListener('pointerdown', unlock, true);
        window.addEventListener('keydown', unlock, true);
        ctx.onstatechange = publishState;
        function bindRing(sab) {
          if (audio.ring) return;
          audio.ring = sab;
          words = new Int32Array(sab, 0, 8);
          audio.words = words;
          audio.cap = Atomics.load(words, 2);
          audio.samples = new Float32Array(sab, 32, audio.cap * 2);
          audio.read = Atomics.load(words, 1);
          Atomics.store(words, 3, ctx.sampleRate | 0);
          publishState();
          if (WEBLOG)
            console.log('[audio] ring bound: cap=' + audio.cap + ' frames (' +
                      (audio.cap / ctx.sampleRate).toFixed(2) + 's), rate=' +
                      ctx.sampleRate + ', state=' + ctx.state +
                      (audio.unlocked ? ', unlocked' : ', waiting for gesture'));
        }
        function onWorkerMsg(e) {
          if (e.data && e.data.xuoAudioRing) bindRing(e.data.xuoAudioRing);
        }
        // the ring arrives via postMessage from the pthread worker. Messages
        // from a Worker fire on the Worker object (not the window) and the
        // objects live in emscripten's PThread registry; addEventListener
        // adds a second listener next to emscripten's onmessage (our message
        // carries no cmd field, so emscripten's pump ignores it silently).
        var hooked = [];
        function hookWorker(w) {
          if (w && w.addEventListener && hooked.indexOf(w) < 0) {
            hooked.push(w);
            w.addEventListener('message', onWorkerMsg);
          }
        }
        function hookPThread() {
          if (!window.PThread) {
            return setTimeout(hookPThread, 100);
          }
          if (!PThread.__xuoAudioHooked) {
            PThread.__xuoAudioHooked = true;
            var orig = PThread.loadWasmModuleToWorker;
            PThread.loadWasmModuleToWorker = function (worker) {
              hookWorker(worker);
              return orig.apply(this, arguments);
            };
          }
          Object.keys(PThread.pthreads).forEach(function (k) { hookWorker(PThread.pthreads[k]); });
          (PThread.unusedWorkers || []).forEach(hookWorker);
        }
        hookPThread();
      })();
      // Web persistence (idbfs). This page's MEMFS is the authoritative
      // filesystem: PROXY_TO_PTHREAD serves every C-level file operation of
      // the pthread worker through the main thread, so the mutable state
      // (crossuo.cfg, the session log, the assistant ini, the profile data
      // under /desktop) lives HERE. Mount IndexedDB over /data (scratch
      // mountpoint - entries are keyed by their real absolute paths), pull
      // the persisted state in once, then re-persist the whitelist on a
      // slow tick. The streamed install under /install is deliberately
      // NEVER synced: it is re-fetchable session-local data (the browser
      // http cache keeps the fetched blobs, boot re-fetches on demand) and
      // serializing hundreds of MB of blob store on the ui thread would
      // stall the page. Whitelist scoping (instead of a whole-tree
      // FS.syncfs) keeps every tick KB-scale and O(1) in the install size.
      (function () {
        var MOUNT = '/data';
        var PERSIST_FILES = ['/crossuo.cfg', '/crossuo.log', '/xuoassist.ini'];
        var PERSIST_TREES = ['/desktop']; // profile data (macros, gumps, custom houses)
        var PERSIST_MAX_FILE = 1 * 1024 * 1024;
        var PERSIST_MS = 30000;
        function collect(out, path, depth) {
          var names;
          try { names = FS.readdir(path); } catch (e) { return; }
          names.forEach(function (name) {
            if (name === '.' || name === '..') return;
            var full = (path === '/' ? '' : path) + '/' + name;
            var st;
            try { st = FS.stat(full); } catch (e) { return; }
            if (FS.isDir(st.mode)) {
              if (depth > 0) collect(out, full, depth - 1);
            } else if (st.size <= PERSIST_MAX_FILE) {
              out.push(full);
            }
          });
        }
        function restore() {
          try {
            FS.mkdirTree(MOUNT);
            FS.mount(IDBFS, {}, MOUNT);
          } catch (e) {
            console.error('[idb][main] mount failed:', e);
            return;
          }
          var t0 = performance.now();
          FS.syncfs(true, function (err) {
            if (err) console.error('[idb][main] restore failed:', err);
            if (!WEBLOG) return;
            console.log('[idb][main] restore done in ' + (performance.now() - t0).toFixed(0) + 'ms' +
                        (err ? ' (FAILED)' : ''));
          });
        }
        function persistTick() {
          var paths = [];
          PERSIST_FILES.forEach(function (p) {
            try { if (FS.isFile(FS.stat(p).mode)) paths.push(p); } catch (e) { /* not written yet */ }
          });
          PERSIST_TREES.forEach(function (root) { collect(paths, root, 6); });
          if (!paths.length) return;
          IDBFS.getDB(MOUNT, function (err, db) {
            if (err) { console.error('[idb][main] persist: db unavailable:', err); return; }
            var t0 = performance.now(), files = 0, bytes = 0;
            try {
              var store = db.transaction(['FILE_DATA'], 'readwrite').objectStore('FILE_DATA');
              paths.forEach(function (path) {
                var st = FS.stat(path);
                store.put({ timestamp: st.mtime, mode: st.mode, contents: FS.readFile(path) }, path);
                files++;
                bytes += st.size;
              });
            } catch (e) {
              console.error('[idb][main] persist failed:', e);
              return;
            }
            if (!WEBLOG) return;
            console.log('[idb][main] persist tick: ' + files + ' files, ' +
                        (bytes / 1024).toFixed(0) + ' kB, ' +
                        (performance.now() - t0).toFixed(0) + 'ms');
          });
        }
        (function whenReady() {
          if (typeof FS === 'undefined' || typeof IDBFS === 'undefined' || !FS.mounts) {
            return setTimeout(whenReady, 25);
          }
          restore();
          setInterval(persistTick, PERSIST_MS);
        })();
      })();
    </script>
    <script>
      // Pre-boot shard picker + client boot gating. crossuo.js used to load
      // statically from a <script async> tag here; it now loads ONLY from
      // bootClient(): the emscripten runtime consumes Module.arguments once
      // at init (PROXY_TO_PTHREAD forwards it to the worker), so the final
      // argument assembly must be done before the glue is injected. The
      // whole block is best-effort: any fetch/parse failure falls back to
      // the previous behavior (boot immediately, client defaults, the URL
      // params honored). The picker click doubles as the audio-unlock
      // gesture (the audio block above listens on window in capture phase).
      //
      // v1 scope (see shardToArgs): only flags that already exist in
      // src/Main.cpp InitCli are emitted. clientversion, crypt and the
      // url/urlforum/urlregister/urlother links have NO CLI surface yet, so
      // they are deliberately NOT passed - the client keeps its defaults
      // (a crossuo.cfg persisted in IDBFS could carry them later).
      (function () {
        var params = new URLSearchParams(window.location.search);
        var shards = [];
        var booted = false;
        var selected = -1;
        var ui = null;

        // ---- pure helpers (extracted verbatim for the node test harness) ----

        // tolerant ini parser for the aggregated shards.cfg ([Shard]
        // sections): handles CRLF/CR/LF, line-leading ';'/'#' comments and
        // blank lines; keys are lower-cased; '[Shard]' sections without a
        // usable name= are skipped (warned)
        function parseShardsIni(text, warn) {
          function flush() {
            if (!cur) return;
            if (cur.name) out.push(cur);
            else if (warn) warn('[shards] section without name, skipped');
            cur = null;
          }
          var out = [];
          var cur = null;
          var lines = String(text).replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].replace(/^[ \t]+/, '').replace(/[ \t]+$/, '');
            if (!line || line.charAt(0) === ';' || line.charAt(0) === '#') continue;
            if (line.charAt(0) === '[') {
              flush();
              cur = /^\[\s*shard\s*\]$/i.test(line) ? {} : null;
              continue;
            }
            var eq = line.indexOf('=');
            if (!cur || eq < 1) continue; // stray line or empty key
            cur[line.substring(0, eq).replace(/[ \t]+$/, '').toLowerCase()] =
              line.substring(eq + 1).replace(/^[ \t]+/, '');
          }
          flush();
          return out;
        }

        // chosen shard -> client args. ONLY existing flags (src/Main.cpp
        // InitCli): --shard names the per-shard streaming install dir and is
        // sanitized like the desktop (Main.cpp: '/' '\' ' ' -> '_');
        // loginserver "host,port" maps to --host/--port (port only when
        // numeric - the flag is u32); installer uo+<url>/xuo+<url> streams
        // that product via --streaming-product, while uo+latest and the
        // website+/download+ installers map to nothing (v1: clientversion
        // and the links stay unparsed - see the block comment above)
        function shardToArgs(shard) {
          var args = [];
          if (!shard || !shard.name) return args;
          args.push('--shard=' + String(shard.name).replace(/[/\\ ]/g, '_'));
          var ls = String(shard.loginserver || '').split(',');
          var host = (ls[0] || '').trim();
          var port = (ls[1] || '').trim();
          if (host) args.push('--host=' + host);
          // 1-5 digits, 1-65535 only; out-of-range/non-numeric ports fall back
          // to the client default by omission of the --port flag
          if (/^\d{1,5}$/.test(port) && port > 0 && port <= 65535) args.push('--port=' + port);
          var m = /^(uo|xuo)\+(https?:\/\/\S+)$/i.exec(String(shard.installer || '').trim());
          if (m) args.push('--streaming-product=' + m[2]);
          return args;
        }

        // ---- boot gating ----------------------------------------------------

        // final argument assembly (moved out of the boot IIFE above so the
        // chosen shard's flags merge in BEFORE crossuo.js loads). Order
        // matters: popts keeps the LAST value of a repeated flag, so the
        // testing overrides (?shard-address/?shard-port) go last and win
        // over the shard entry's own --host/--port
        function buildClientArgs(extraArgs) {
          var args = ['./crossuo'];
          var q = window.location.search.substring(1);
          if (q) {
            q.split('&').forEach(function (kv) {
              if (!kv) return;
              // a malformed %-escape must never prevent boot: on decode throw
              // push the RAW pair (the client tolerates junk args)
              try {
                args.push(decodeURIComponent(kv));
              } catch (e) {
                args.push(kv);
              }
            });
          }
          if (extraArgs) args.push.apply(args, extraArgs);
          // shard address override for the ws proxy (testing): maps to the
          // client's login-server override flags (LoadLogin consults them)
          var shardAddr = params.get('shard-address');
          var shardPort = params.get('shard-port');
          if (shardAddr) args.push('--host=' + shardAddr);
          if (shardPort) args.push('--port=' + shardPort);
          return args;
        }

        // idempotent: every path (picker Play, Play Default, deep link,
        // fallback) funnels here and the module boots exactly once
        function bootClient(extraArgs) {
          if (booted) return;
          booted = true;
          hidePicker();
          // Module.arguments must be FINAL before the glue runs (consumed
          // once at runtime init)
          Module.arguments = buildClientArgs(extraArgs);
          var s = document.createElement('script');
          s.src = 'crossuo.js';
          s.async = true;
          document.body.appendChild(s);
        }

        function setPageStatus(text) {
          // #status only exists with ?log=1 (the boot IIFE removes it
          // otherwise); the picker panel carries its own state line
          var el = document.getElementById('status');
          if (el) el.textContent = text;
        }

        // ---- shards.cfg loading ---------------------------------------------

        function shardSources() {
          // ?shards=<url> replaces the whole source list (testing)
          var override = params.get('shards');
          if (override) return [override];
          // same-origin first (deployments may vendor shards.cfg next to
          // index.html), then the curated list on GitHub (CORS-enabled)
          return ['shards.cfg',
                  'https://raw.githubusercontent.com/crossuo/shards/release/shards.cfg'];
        }

        function fetchText(url, cb) {
          var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
          // 10s cap: shard infra must never delay the boot indefinitely
          var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 10000) : null;
          var opts = { credentials: 'omit' };
          if (ctrl) opts.signal = ctrl.signal;
          fetch(url, opts)
            .then(function (r) {
              if (!r.ok) throw new Error('http ' + r.status);
              return r.text();
            })
            .then(function (text) {
              if (timer) clearTimeout(timer);
              cb(null, text);
            })
            .catch(function (err) {
              if (timer) clearTimeout(timer);
              cb(err);
            });
        }

        // the first source that fetches AND parses into >= 1 shard wins;
        // every failure falls through, exhausted sources => fallback mode
        function loadShards(cb) {
          var sources = shardSources();
          (function next(i) {
            if (i >= sources.length) {
              console.warn('[shards] no usable shards.cfg source');
              return cb(new Error('shards unavailable'));
            }
            fetchText(sources[i], function (err, text) {
              var list = [];
              if (!err) {
                try {
                  list = parseShardsIni(text, function (msg) { console.warn(msg); });
                } catch (e) { err = e; }
              }
              if (err || !list.length) {
                console.warn('[shards] source unusable:', sources[i], err || 'empty');
                return next(i + 1);
              }
              if (WEBLOG) console.log('[shards] ' + list.length + ' shards from ' + sources[i]);
              cb(null, list);
            });
          })(0);
        }

        // ?shard=<name|index>: case-insensitive name match first, then a
        // 0-based numeric index into the loaded list
        function resolveShard(key) {
          var want = String(key).toLowerCase();
          for (var i = 0; i < shards.length; i++) {
            if (String(shards[i].name).toLowerCase() === want) return shards[i];
          }
          if (/^\d+$/.test(want)) {
            var n = parseInt(want, 10);
            if (n < shards.length) return shards[n];
          }
          return null;
        }

        // ---- picker UI ------------------------------------------------------

        function hidePicker() {
          if (ui && ui.overlay.parentNode) ui.overlay.parentNode.removeChild(ui.overlay);
          ui = null;
        }

        function select(i) {
          selected = i;
          if (!ui) return;
          var rows = ui.list.childNodes;
          for (var k = 0; k < rows.length; k++) {
            rows[k].classList[k === i ? 'add' : 'remove']('sel');
          }
          ui.play.disabled = i < 0;
        }

        function play(i) {
          var entry = shards[i];
          if (!entry || booted) return;
          setPageStatus('starting ' + entry.name + '\u2026');
          if (ui) ui.state.textContent = 'starting ' + entry.name + '\u2026';
          bootClient(shardToArgs(entry));
        }

        function showPicker() {
          if (booted || ui) return;
          var overlay = document.createElement('div');
          overlay.id = 'shardPicker';
          overlay.tabIndex = 0;
          var panel = document.createElement('div');
          panel.className = 'panel';
          var title = document.createElement('div');
          title.className = 'title';
          title.textContent = 'Choose a Shard';
          var list = document.createElement('div');
          list.className = 'list';
          var footer = document.createElement('div');
          footer.className = 'footer';
          var state = document.createElement('div');
          state.className = 'state';
          var buttons = document.createElement('div');
          buttons.className = 'buttons';
          var playBtn = document.createElement('button');
          playBtn.textContent = 'Play';
          playBtn.disabled = true;
          playBtn.addEventListener('click', function () { play(selected); });
          var defBtn = document.createElement('button');
          defBtn.textContent = 'Play Default';
          defBtn.addEventListener('click', function () { play(0); });
          for (var i = 0; i < shards.length; i++) {
            (function (i) {
              var row = document.createElement('div');
              row.className = 'row';
              var name = document.createElement('div');
              name.className = 'name';
              name.textContent = shards[i].name; // display name stays raw
              row.appendChild(name);
              var sub = shards[i].loginserver || '';
              if (shards[i].tags) sub += (sub ? ' \u00b7 ' : '') + shards[i].tags;
              if (sub) {
                var subEl = document.createElement('div');
                subEl.className = 'sub';
                subEl.textContent = sub;
                row.appendChild(subEl);
              }
              row.addEventListener('click', function () { select(i); });
              row.addEventListener('dblclick', function () { play(i); });
              list.appendChild(row);
            })(i);
          }
          // arrows move the selection, enter plays it
          overlay.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
              e.preventDefault();
              var n = shards.length;
              if (!n) return;
              var base = selected < 0 ? (e.key === 'ArrowDown' ? -1 : 0) : selected;
              select((base + (e.key === 'ArrowDown' ? 1 : n - 1)) % n);
            } else if (e.key === 'Enter' && selected >= 0) {
              play(selected);
            }
          });
          buttons.appendChild(playBtn);
          buttons.appendChild(defBtn);
          footer.appendChild(state);
          footer.appendChild(buttons);
          panel.appendChild(title);
          panel.appendChild(list);
          panel.appendChild(footer);
          overlay.appendChild(panel);
          document.body.appendChild(overlay);
          ui = { overlay: overlay, list: list, play: playBtn, state: state };
          overlay.focus();
        }

        // ---- flow -------------------------------------------------------------

        var deepLink = params.get('shard');
        if (deepLink) {
          // deep link: never show the picker - resolve, then boot right away
          setPageStatus('loading shards\u2026');
          loadShards(function (err) {
            var entry = err ? null : resolveShard(deepLink);
            if (err || !entry)
              console.warn('[shards] ?shard=' + deepLink +
                           (err ? ' unavailable' : ' not found') + ', booting with defaults');
            setPageStatus('starting ' + (entry ? entry.name : 'client') + '\u2026');
            bootClient(entry ? shardToArgs(entry) : []);
          });
        } else {
          setPageStatus('loading shards\u2026');
          loadShards(function (err, list) {
            if (err || !list.length) return bootClient([]); // old behavior
            shards = list;
            showPicker();
          });
        }
      })();
    </script>
